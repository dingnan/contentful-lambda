<section class="home">
  <div class="home__header">
    <h1>Latest Articles</h1>
    <button class="btn btn--secondary" (click)="refresh()" [disabled]="loading">
      {{ loading ? 'Loading...' : 'Refresh' }}
    </button>
  </div>

  <!-- Loading State -->
  <div class="home__loading" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading content from Akamai CDN...</p>
  </div>

  <!-- Error State -->
  <div class="home__error" *ngIf="error && !loading">
    <p>{{ error }}</p>
    <button class="btn btn--primary" (click)="refresh()">Try Again</button>
  </div>

  <!-- Articles Grid -->
  <div class="articles-grid" *ngIf="!loading && !error">
    <article class="article-card" *ngFor="let article of articles">
      <div class="article-card__image" *ngIf="article.image">
        <img
          [src]="'https:' + article.image?.fields?.file?.url"
          [alt]="article.image?.fields?.title"
          loading="lazy"
        />
      </div>

      <div class="article-card__body">
        <time class="article-card__date" *ngIf="article.publishDate">
          {{ article.publishDate | date: 'mediumDate' }}
        </time>
        <h2 class="article-card__title">{{ article.title }}</h2>
        <p class="article-card__summary" *ngIf="article.summary">
          {{ article.summary }}
        </p>
        <a class="btn btn--primary" [routerLink]="['/article', article.slug]">
          Read More
        </a>
      </div>
    </article>

    <!-- Empty State -->
    <div class="home__empty" *ngIf="articles.length === 0">
      <p>No articles published yet.</p>
    </div>
  </div>
</section>
